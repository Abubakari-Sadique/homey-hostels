<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HowardHostels 🏠</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #ffeef8 0%, #e8f4fd 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        
        h1 {
            color: #d63384;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            color: #6f42c1;
            font-size: 1.2em;
            margin-bottom: 30px;
            font-style: italic;
        }
        
        .form-group {
            margin-bottom: 25px;
            text-align: left;
        }
        
        label {
            display: block;
            color: #495057;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 1.1em;
        }
        
        input, select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fff;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #f8c2cc;
            box-shadow: 0 0 10px rgba(248, 194, 204, 0.3);
        }
        
        .book-btn {
            background: linear-gradient(45deg, #f8c2cc, #a8dadc);
            color: #495057;
            border: none;
            padding: 15px 40px;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .book-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        .success-message {
            display: none;
            background: linear-gradient(45deg, #d4edda, #c3e6cb);
            color: #155724;
            padding: 20px;
            border-radius: 15px;
            margin-top: 25px;
            font-size: 1.2em;
            font-weight: bold;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .emoji {
            font-size: 1.5em;
            margin: 0 5px;
        }
        
        .deployed-by {
            margin-top: 30px;
            padding: 15px;
            background: rgba(108, 117, 125, 0.1);
            border-radius: 10px;
            font-size: 0.9em;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AbdallahHostels <span class="emoji">🏠</span></h1>
        <p class="subtitle">Your home away from home!</p>
        
        <form id="bookingForm">
            <div class="form-group">
                <label for="userName">Your Name <span class="emoji">😊</span></label>
                <input type="text" id="userName" name="userName" required placeholder="e.g., Akosua">
            </div>
            
            <div class="form-group">
                <label for="roomNumber">Choose Your Room <span class="emoji">🛏️</span></label>
                <select id="roomNumber" name="roomNumber" required>
                    <option value="">Select a room...</option>
                    <option value="101">Room 101 - Cozy Single 🌸</option>
                    <option value="102">Room 102 - Twin Paradise 🌺</option>
                    <option value="201">Room 201 - Garden View 🌿</option>
                    <option value="202">Room 202 - City View 🌃</option>
                    <option value="301">Room 301 - Penthouse Suite 👑</option>
                </select>
            </div>
            
            <button type="submit" class="book-btn">Book My Stay! <span class="emoji">✨</span></button>
        </form>
        
        <div id="successMessage" class="success-message"></div>
        
        <div class="deployed-by">
            <span class="emoji">🚀</span> Deployed automatically to EC2 via CodePipeline! <br>
            <small>Version: 1.0 | Server: <span id="serverInfo"></span></small>
        </div>
    </div>

    <script>
        document.getElementById('serverInfo').textContent = 'EC2 Instance - ' + new Date().toLocaleString();
        
        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userName = document.getElementById('userName').value;
            const roomNumber = document.getElementById('roomNumber').value;
            const roomText = document.getElementById('roomNumber').options[document.getElementById('roomNumber').selectedIndex].text;
            
            const successMessage = document.getElementById('successMessage');
            successMessage.innerHTML = `
                <span class="emoji">🎉</span> Congrats, ${userName}! <span class="emoji">🎉</span><br>
                ${roomText} successfully booked!<br>
                <span class="emoji">🥳</span> Welcome to HowardHostels! <span class="emoji">💕</span>
            `;
            
            successMessage.style.display = 'block';
            
            // Hide form after booking
            document.getElementById('bookingForm').style.display = 'none';
            
            // Add some celebration
            setTimeout(() => {
                successMessage.innerHTML += '<br><span class="emoji">🌟</span> Check your email for confirmation! <span class="emoji">📧</span>';
            }, 2000);
        });
    </script>
</body>
</html>
